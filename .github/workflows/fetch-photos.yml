name: Fetch character photos

on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Character ids to refresh, separated by spaces (empty = all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download character pictures
        env:
          IDS: ${{ inputs.ids }}
        run: node tools/fetch-character-images.mjs $IDS
      - name: Commit the pictures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/characters js/data/images.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update character pictures from the Supernatural Wiki"
          git push
